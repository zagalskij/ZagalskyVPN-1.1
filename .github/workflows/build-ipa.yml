name: Build Zagalsky VPN IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: Vendor/AmneziaWG/Sources/WireGuardKitGo/go.sum
      - name: Build for physical iPhone (unsigned)
        run: |
          xcodebuild -version
          go version
          xcodebuild \
            -project ZagVPN.xcodeproj \
            -scheme ZagVPN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ZAGALSKY_GO_BINARY="$(command -v go)" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/ios-build" \
            build
      - name: Package IPA
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/package/Payload" dist
          cp -R "$RUNNER_TEMP/ios-build/ZagVPN.app" "$RUNNER_TEMP/package/Payload/"
          app="$RUNNER_TEMP/package/Payload/ZagVPN.app"
          tunnel="$app/PlugIns/PacketTunnel.appex"
          test -f "$app/Info.plist"
          test -f "$tunnel/Info.plist"
          test -f "$app/ZagVPN"
          test -f "$tunnel/PacketTunnel"
          file "$app/ZagVPN" "$tunnel/PacketTunnel"
          (cd "$RUNNER_TEMP/package" && zip -qry "$GITHUB_WORKSPACE/dist/ZagalskyVPN.ipa" Payload)
          unzip -t dist/ZagalskyVPN.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ZagalskyVPN-unsigned
          path: dist/ZagalskyVPN.ipa
          if-no-files-found: error
